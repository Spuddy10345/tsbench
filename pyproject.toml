[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tsbench"
dynamic = ["version"]
description = "Benchmark Tailscale (Mullvad) exit nodes, remember how they perform, and apply the best one."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["tailscale", "mullvad", "exit-node", "benchmark", "vpn"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Networking",
]
dependencies = []  # standard library only, on purpose

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]

[project.scripts]
tsbench = "tsbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "tsbench.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests"]
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E701", "E702", "UP006", "UP007", "UP035", "UP045"]  # one-line helpers; py3.9 typing style
