[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tsbench"
dynamic = ["version"]
description = "Benchmark Tailscale (Mullvad) exit nodes, remember how they perform, and apply the best one."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Spuddy10345" }]
keywords = ["tailscale", "mullvad", "exit-node", "benchmark", "vpn"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Networking",
]
dependencies = []  # standard library only, on purpose

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]

[project.urls]
Homepage = "https://github.com/Spuddy10345/tsbench"
Issues = "https://github.com/Spuddy10345/tsbench/issues"
Changelog = "https://github.com/Spuddy10345/tsbench/blob/main/CHANGELOG.md"
Security = "https://github.com/Spuddy10345/tsbench/security/policy"

[project.scripts]
tsbench = "tsbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "tsbench.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests"]
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E701", "E702", "UP006", "UP007", "UP035", "UP045"]  # one-line helpers; py3.9 typing style
